
name: Native desktop validation

run-name: Fire User desktop - ${{ inputs.request_id || github.run_number }}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Package to build
        type: choice
        default: all
        options:
          - all
          - win-x64
          - win-arm64
          - osx-x64
          - osx-arm64
          - linux-x64
          - linux-arm64
      request_id:
        description: Optional build correlation ID
        type: string
        required: false

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  # ==================================================
  # PLAN
  # ==================================================

  plan:
    name: Prepare build matrix
    runs-on: ubuntu-22.04

    outputs:
      matrix: ${{ steps.select.outputs.matrix }}

    steps:
      - name: Select target platforms
        id: select
        shell: bash
        env:
          BUILD_TARGET: ${{ inputs.target || 'all' }}
        run: |
          python3 - <<'PY'
          import json
          import os

          entries = [
              {"os": "windows-2022", "rid": "win-x64"},
              {"os": "ubuntu-22.04", "rid": "linux-x64"},
              {"os": "ubuntu-22.04-arm", "rid": "linux-arm64"},
              {"os": "macos-15", "rid": "osx-arm64"},
              {"os": "macos-15-intel", "rid": "osx-x64"},
          ]

          target = os.environ["BUILD_TARGET"]
          native_target = "win-x64" if target == "win-arm64" else target

          selected = [
              item for item in entries
              if target == "all" or item["rid"] == native_target
          ]

          if not selected:
              raise SystemExit("Unsupported package target")

          matrix = {"include": selected}

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps(matrix) + "\n")
          PY

  # ==================================================
  # PARALLEL DESKTOP BUILDS
  # ==================================================

  desktop:
    name: Build and package ${{ matrix.rid }}
    needs: plan

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
      # ----------------------------------------------
      # Environment
      # ----------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache verified macOS media runtime
        id: media-cache
        if: runner.os == 'macOS'
        uses: actions/cache/restore@v4
        with:
          path: Native/media/${{ matrix.rid }}
          key: source-media-${{ matrix.rid }}-${{ hashFiles('scripts/media-runtimes.json', 'scripts/build-native.py') }}

      # ----------------------------------------------
      # Linux dependencies
      # ----------------------------------------------

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libx11-dev \
            libxtst-dev \
            libxcb1-dev \
            libfontconfig1 \
            libice6 \
            libsm6 \
            libssl-dev \
            python3 \
            xvfb \
            dbus-daemon \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-pipewire \
            rpm \
            zstd \
            squashfs-tools \
            desktop-file-utils \
            file

      # ----------------------------------------------
      # macOS dependencies
      # ----------------------------------------------

      - name: Install macOS media dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list nasm >/dev/null 2>&1 || brew install nasm

      # ----------------------------------------------
      # LiveKit native bridge
      # ----------------------------------------------

      - name: Build LiveKit bridge on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-native.ps1 -RuntimeIdentifier '${{ matrix.rid }}'

      - name: Build LiveKit bridge on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 scripts/build-native.py --rid '${{ matrix.rid }}'

      # ----------------------------------------------
      # Build tests
      # ----------------------------------------------

      - name: Check build tooling
        shell: bash
        run: |
          set -e

          python -m unittest discover -s Tests -p '*Build*Tests.py'
          python -m unittest discover -s Tests -p 'MacBundleTests.py'

      # ----------------------------------------------
      # Application build
      # ----------------------------------------------

      - name: Build Avalonia application
        shell: bash
        run: |
          dotnet build UserIdentityDesktop.csproj -c Release

      - name: Verify macOS media runtime
        id: mac-media
        if: runner.os == 'macOS'
        shell: bash
        run: |
          Native/media/${{ matrix.rid }}/ffmpeg -version

      # ----------------------------------------------
      # Linux startup test
      # ----------------------------------------------

      - name: Linux native startup smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          smoke_root=$(mktemp -d)
          trap 'rm -rf "$smoke_root"' EXIT

          mkdir -p \
            "$smoke_root/config" \
            "$smoke_root/data" \
            "$smoke_root/cache"

          XDG_CONFIG_HOME="$smoke_root/config" \
          XDG_DATA_HOME="$smoke_root/data" \
          XDG_CACHE_HOME="$smoke_root/cache" \
          timeout 30s xvfb-run -a \
            "./bin/Release/net10.0/Fire User Connect" \
            --startup-smoke-test

      # ----------------------------------------------
      # .NET tests
      # ----------------------------------------------

      - name: Run application tests
        shell: bash
        run: |
          dotnet test Tests/UserIdentityDesktop.Tests.csproj -c Release

      # ==================================================
      # PUBLISH APPLICATION
      # ==================================================

      - name: Publish Windows and macOS client
        if: runner.os != 'Linux'
        shell: pwsh
        run: |
          ./scripts/publish-desktop.ps1 -RuntimeIdentifier '${{ matrix.rid }}'

      - name: Publish Linux client
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dotnet publish UserIdentityDesktop.csproj -c Release -r '${{ matrix.rid }}' --self-contained true -o 'artifacts/${{ matrix.rid }}'

      # ----------------------------------------------
      # Linux ABI verification
      # ----------------------------------------------

      - name: Verify Linux ABI baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 scripts/check-linux-abi.py --source 'artifacts/${{ matrix.rid }}'

      # ----------------------------------------------
      # Packaged media verification
      # ----------------------------------------------

      - name: Verify packaged media executable
        shell: bash
        env:
          PACKAGE_RID: ${{ matrix.rid }}
        run: |
          python -c "import os,subprocess; from pathlib import Path; rid=os.environ['PACKAGE_RID']; binary=Path('artifacts')/rid/'media'/('ffmpeg.exe' if rid.startswith('win-') else 'ffmpeg'); subprocess.run([str(binary),'-version'],check=True)"

      # ----------------------------------------------
      # Windows and macOS startup verification
      # ----------------------------------------------

      - name: Verify Windows and macOS packaged startup
        if: runner.os != 'Linux'
        shell: pwsh
        env:
          PACKAGE_RID: ${{ matrix.rid }}
        run: |
          $packageRoot = Join-Path $PWD "artifacts/$env:PACKAGE_RID"

          if ($IsWindows) {
            $binary = Join-Path $packageRoot 'Fire User Connect.exe'
          }
          else {
            $binary = Join-Path $packageRoot 'Fire User Connect.app/Contents/MacOS/Fire User Connect'
          }

          if (-not (Test-Path $binary)) {
            throw "Application executable missing: $binary"
          }

          $process = Start-Process -FilePath $binary -ArgumentList '--startup-smoke-test' -PassThru

          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Packaged application startup timed out.'
          }

          if ($process.ExitCode -ne 0) {
            throw 'Packaged application startup failed.'
          }

      # ==================================================
      # GENERATE INSTALLERS
      # ==================================================

      - name: Create OS installers
        shell: bash
        run: |
          python scripts/build-installers.py --rid '${{ matrix.rid }}' --source 'artifacts/${{ matrix.rid }}' --output installers

      # ----------------------------------------------
      # Basic installer verification
      # ----------------------------------------------

      - name: Verify installer output
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d installers ]; then
            echo "::error::Installer directory missing."
            exit 1
          fi

          if [ -z "$(find installers -type f -print -quit)" ]; then
            echo "::error::No installer files generated."
            exit 1
          fi

          echo "Generated installers:"
          find installers -type f -print

      # ----------------------------------------------
      # Linux installer format verification
      # ----------------------------------------------

      - name: Verify all Linux installer formats
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          RID="${{ matrix.rid }}"

          if [[ "$RID" == "linux-x64" ]]; then
            ARCH="x86_64"
            DEB_ARCH="amd64"
          else
            ARCH="aarch64"
            DEB_ARCH="arm64"
          fi

          required_formats=(
            deb
            rpm
            pkg.tar.zst
            AppImage
            run
          )

          for extension in "${required_formats[@]}"; do
            files=(installers/*."$extension")

            if (( ${#files[@]} == 0 )); then
              echo "::error::Missing $extension installer for $RID"
              exit 1
            fi

            for installer in "${files[@]}"; do
              test -s "$installer"
              echo "Verified: $installer"
            done
          done

          # Verify Debian package architecture
          for installer in installers/*.deb; do
            test "$(dpkg-deb -f "$installer" Architecture)" = "$DEB_ARCH"
          done

          # Verify RPM package architecture and metadata
          for installer in installers/*.rpm; do
            test "$(rpm -qp --qf '%{ARCH}' "$installer")" = "$ARCH"
          done

          # Verify Arch Linux package archive
          for installer in installers/*.pkg.tar.zst; do
            tar --zstd -tf "$installer" | grep -Eq '^\./?\.PKGINFO$'
          done

          # Verify AppImage file signatures
          for installer in installers/*.AppImage; do
            file "$installer" | grep -q ELF
          done

          # Verify universal Linux installer help
          for installer in installers/*.run; do
            bash "$installer" --help
          done

          echo "All Linux package formats verified for $RID"

      # ==================================================
      # UPLOAD INSTALLER ARTIFACTS
      # ==================================================

      - name: Upload OS installers
        uses: actions/upload-artifact@v4
        with:
          name: fire-user-installers-${{ matrix.rid }}
          path: installers/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # ==================================================
      # PORTABLE APPLICATION ARCHIVES
      # ==================================================

      - name: Archive Unix application
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p packages

          tar -czf 'packages/fire-user-${{ matrix.rid }}.tar.gz' -C 'artifacts/${{ matrix.rid }}' .

      - name: Archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path packages -Force | Out-Null

          tar -czf 'packages/fire-user-${{ matrix.rid }}.tar.gz' -C 'artifacts/${{ matrix.rid }}' .

          if ($LASTEXITCODE -ne 0) {
            throw 'Windows package archive failed.'
          }

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: fire-user-${{ matrix.rid }}
          path: packages/fire-user-${{ matrix.rid }}.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # ==================================================
      # WINDOWS ARM64 COMPATIBILITY PREPARATION
      # ==================================================

      - name: Upload Windows native validation executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: native-validation-win-x64
          path: Native/build/win-x64/Release/bridge_smoke.exe
          if-no-files-found: error
          retention-days: 30

      - name: Compile Windows ARM compatibility installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python scripts/build-installers.py --rid win-arm64-emulated --source artifacts/win-x64 --output arm-installers

      - name: Stage Windows ARM installer for verification
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-validation-win-arm64
          path: arm-installers/*
          if-no-files-found: error
          retention-days: 30

      # ----------------------------------------------
      # macOS media cache
      # ----------------------------------------------

      - name: Save macOS media runtime cache
        if: >-
          always() &&
          runner.os == 'macOS' &&
          steps.mac-media.outcome == 'success' &&
          steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Native/media/${{ matrix.rid }}
          key: source-media-${{ matrix.rid }}-${{ hashFiles('scripts/media-runtimes.json', 'scripts/build-native.py') }}

  # ==================================================
  # WINDOWS ARM64 VALIDATION
  # ==================================================

  windows-arm:
    name: Windows 11 ARM64 compatibility

    needs:
      - desktop

    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.target == 'all' ||
      inputs.target == 'win-arm64'

    runs-on: windows-11-arm

    steps:
      - name: Download Windows x64 portable package
        uses: actions/download-artifact@v4
        with:
          name: fire-user-win-x64
          path: incoming

      - name: Download native validation executable
        uses: actions/download-artifact@v4
        with:
          name: native-validation-win-x64
          path: validation

      - name: Download ARM installer
        uses: actions/download-artifact@v4
        with:
          name: installer-validation-win-arm64
          path: installers

      - name: Verify Windows ARM64 compatibility
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') {
            throw 'Expected Windows ARM64 runner.'
          }

          New-Item -ItemType Directory -Path artifacts/win-arm64-emulated,packages -Force | Out-Null

          tar -xzf incoming/fire-user-win-x64.tar.gz -C artifacts/win-arm64-emulated

          if ($LASTEXITCODE -ne 0) {
            throw 'Package extraction failed.'
          }

          Copy-Item validation/bridge_smoke.exe artifacts/win-arm64-emulated/

          Push-Location artifacts/win-arm64-emulated

          try {
            & ./bridge_smoke.exe

            if ($LASTEXITCODE -ne 0) {
              throw 'Native runtime failed under x64 emulation.'
            }

            & ./media/ffmpeg.exe -version

            if ($LASTEXITCODE -ne 0) {
              throw 'FFmpeg failed under x64 emulation.'
            }

            $process = Start-Process -FilePath "$PWD/Fire User Connect.exe" -ArgumentList '--startup-smoke-test' -PassThru

            if (-not $process.WaitForExit(30000)) {
              $process.Kill()
              throw 'Windows ARM application startup timed out.'
            }

            if ($process.ExitCode -ne 0) {
              throw 'Windows ARM application startup failed.'
            }

            Remove-Item bridge_smoke.exe

            'Requires Windows 11 ARM64. Runs x64 binaries through Windows emulation. Not a native ARM64 build.' |
              Set-Content COMPATIBILITY.txt

          } finally {
            Pop-Location
          }

          tar -czf packages/fire-user-win-arm64-emulated.tar.gz -C artifacts/win-arm64-emulated .

          if ($LASTEXITCODE -ne 0) {
            throw 'ARM package archive failed.'
          }

      - name: Upload verified Windows ARM installers
        uses: actions/upload-artifact@v4
        with:
          name: fire-user-installers-win-arm64-emulated
          path: installers/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload Windows ARM portable package
        uses: actions/upload-artifact@v4
        with:
          name: fire-user-win-arm64-emulated
          path: packages/fire-user-win-arm64-emulated.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # ==================================================
  # AUTOMATIC GITHUB PRERELEASE PUBLICATION
  # ==================================================

  publish-test-installers:
    name: Publish verified Fire User installers

    needs:
      - desktop
      - windows-arm

    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.target == 'all') &&
      needs.desktop.result == 'success' &&
      needs.windows-arm.result == 'success'

    runs-on: ubuntu-22.04

    permissions:
      actions: read
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: desktop-test-${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ----------------------------------------------
      # Collect all platform installers
      # ----------------------------------------------

      - name: Download verified installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fire-user-installers-*
          path: installers
          merge-multiple: false

      - name: Verify all six platform groups
        shell: bash
        run: |
          set -euo pipefail

          required=(
            win-x64
            win-arm64-emulated
            linux-x64
            linux-arm64
            osx-x64
            osx-arm64
          )

          for rid in "${required[@]}"; do
            directory="installers/fire-user-installers-$rid"

            if [ ! -d "$directory" ]; then
              echo "::error::Missing installer group: $rid"
              exit 1
            fi

            if [ -z "$(find "$directory" -type f -print -quit)" ]; then
              echo "::error::No installer files for $rid"
              exit 1
            fi

            echo "Verified platform: $rid"
          done

      # ----------------------------------------------
      # Prepare release files
      # ----------------------------------------------

      - name: Prepare release assets and SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          python3 - <<'PY'
          import hashlib
          import pathlib
          import shutil

          source = pathlib.Path("installers")
          output = pathlib.Path("release-assets")

          files = sorted(
              path for path in source.rglob("*")
              if path.is_file()
          )

          if not files:
              raise SystemExit("No installers available")

          for path in files:
              destination = output / path.name

              if destination.exists():
                  raise SystemExit(
                      f"Duplicate installer filename: {path.name}"
                  )

              shutil.copy2(path, destination)

          manifest = output / "SHA256SUMS.txt"

          with manifest.open("w", encoding="utf-8") as stream:
              for path in sorted(output.iterdir()):
                  if not path.is_file() or path == manifest:
                      continue

                  digest = hashlib.sha256()

                  with path.open("rb") as content:
                      for block in iter(
                          lambda: content.read(1024 * 1024),
                          b""
                      ):
                          digest.update(block)

                  stream.write(
                      f"{digest.hexdigest()}  {path.name}\n"
                  )

          print("Release assets:")

          for path in sorted(output.iterdir()):
              print(path.name, path.stat().st_size, "bytes")
          PY

      # ----------------------------------------------
      # Create draft release
      # ----------------------------------------------

      - name: Create draft GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "Fire User Desktop - $RELEASE_TAG" \
            --notes "Automated Fire User Desktop test build.

          Commit: $RELEASE_COMMIT
          Workflow: $GITHUB_RUN_ID
          Attempt: $GITHUB_RUN_ATTEMPT

          Platforms:
          - Windows x64
          - Windows 11 ARM64 (x64 emulation)
          - Linux x64
          - Linux ARM64
          - macOS Intel x64
          - macOS Apple Silicon ARM64

          Linux installer formats:
          - Debian DEB
          - RPM
          - Arch Linux package
          - AppImage
          - Universal Linux RUN

          SHA256SUMS.txt contains installer checksums.

          Test build. Installers may be unsigned or unnotarized." \
            --draft \
            --prerelease

      # ----------------------------------------------
      # Upload release assets
      # ----------------------------------------------

      - name: Upload installers to GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "$RELEASE_TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY"

      # ----------------------------------------------
      # Verify published assets before going public
      # ----------------------------------------------

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' \
            > published-assets.txt

          while IFS= read -r filename; do
            if ! grep -Fxq "$filename" published-assets.txt; then
              echo "::error::Missing release asset: $filename"
              exit 1
            fi
          done < <(
            find release-assets \
              -maxdepth 1 \
              -type f \
              -printf '%f\n'
          )

          echo "All release files verified."

      # ----------------------------------------------
      # Publish release only after verification
      # ----------------------------------------------

      - name: Publish verified prerelease
        shell: bash
        run: |
          set -euo pipefail

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease

      # ----------------------------------------------
      # Display download links
      # ----------------------------------------------

      - name: Show installer download location
        shell: bash
        run: |
          set -euo pipefail

          URL=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json url \
            --jq '.url')

          echo "Published release: $URL"

          {
            echo "## Fire User Desktop installers"
            echo ""
            echo "All required installer artifacts passed verification."
            echo ""
            echo "**Download release:** $URL"
            echo ""
            echo "**Commit:** \`$RELEASE_COMMIT\`"
            echo ""
            echo "**Release tag:** \`$RELEASE_TAG\`"
            echo ""
            echo "Individual installers and portable packages are also available under this workflow run's Artifacts section."
          } >> "$GITHUB_STEP_SUMMARY"
