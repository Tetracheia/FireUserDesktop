
name: Native desktop validation

run-name: Fire User desktop - ${{ inputs.request_id || github.run_number }}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Package to build
        type: choice
        default: all
        options:
          - all
          - win-x64
          - win-arm64
          - osx-x64
          - osx-arm64
          - linux-x64
          - linux-arm64
      request_id:
        description: Optional build correlation ID
        type: string
        required: false

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  # ==================================================
  # BUILD MATRIX
  # ==================================================

  plan:
    name: Prepare build matrix
    runs-on: ubuntu-22.04

    outputs:
      matrix: ${{ steps.select.outputs.matrix }}

    steps:
      - name: Select platforms
        id: select
        shell: bash
        env:
          BUILD_TARGET: ${{ inputs.target || 'all' }}
        run: |
          python3 - <<'PY'
          import json
          import os

          entries = [
              {"os": "windows-2022", "rid": "win-x64"},
              {"os": "ubuntu-22.04", "rid": "linux-x64"},
              {"os": "ubuntu-22.04-arm", "rid": "linux-arm64"},
              {"os": "macos-15", "rid": "osx-arm64"},
              {"os": "macos-15-intel", "rid": "osx-x64"},
          ]

          target = os.environ["BUILD_TARGET"]
          native_target = "win-x64" if target == "win-arm64" else target

          selected = [
              item for item in entries
              if target == "all" or item["rid"] == native_target
          ]

          if not selected:
              raise SystemExit("Unsupported target")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(
                  "matrix=" + json.dumps({"include": selected}) + "\n"
              )
          PY

  # ==================================================
  # PARALLEL DESKTOP BUILDS
  # ==================================================

  desktop:
    name: Build ${{ matrix.rid }}
    needs: plan

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ----------------------------------------------
      # macOS cache
      # ----------------------------------------------

      - name: Restore macOS media cache
        id: media-cache
        if: runner.os == 'macOS'
        uses: actions/cache/restore@v4
        with:
          path: Native/media/${{ matrix.rid }}
          key: source-media-${{ matrix.rid }}-${{ hashFiles('scripts/media-runtimes.json', 'scripts/build-native.py') }}

      # ----------------------------------------------
      # Linux dependencies
      # ----------------------------------------------

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libx11-dev \
            libxtst-dev \
            libxcb1-dev \
            libfontconfig1 \
            libice6 \
            libsm6 \
            libssl-dev \
            python3 \
            xvfb \
            dbus-daemon \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-pipewire \
            rpm \
            zstd \
            squashfs-tools \
            desktop-file-utils \
            file

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list nasm >/dev/null 2>&1 || brew install nasm

      # ----------------------------------------------
      # LiveKit native bridge
      # ----------------------------------------------

      - name: Build LiveKit bridge on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-native.ps1 -RuntimeIdentifier '${{ matrix.rid }}'

      - name: Build LiveKit bridge on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 scripts/build-native.py --rid '${{ matrix.rid }}'

      # ----------------------------------------------
      # Tests
      # ----------------------------------------------

      - name: Check build tooling
        shell: bash
        run: |
          set -e
          python -m unittest discover -s Tests -p '*Build*Tests.py'
          python -m unittest discover -s Tests -p 'MacBundleTests.py'

      - name: Build Avalonia application
        shell: bash
        run: |
          dotnet build UserIdentityDesktop.csproj -c Release

      - name: Verify macOS media runtime
        id: mac-media
        if: runner.os == 'macOS'
        shell: bash
        run: |
          Native/media/${{ matrix.rid }}/ffmpeg -version

      - name: Linux startup smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          root=$(mktemp -d)
          trap 'rm -rf "$root"' EXIT

          mkdir -p "$root/config" "$root/data" "$root/cache"

          XDG_CONFIG_HOME="$root/config" \
          XDG_DATA_HOME="$root/data" \
          XDG_CACHE_HOME="$root/cache" \
          timeout 30s xvfb-run -a \
            "./bin/Release/net10.0/Fire User Connect" \
            --startup-smoke-test

      - name: Run application tests
        shell: bash
        run: |
          dotnet test Tests/UserIdentityDesktop.Tests.csproj -c Release

      # ==================================================
      # PUBLISH APPLICATION
      # ==================================================

      - name: Publish Windows and macOS client
        if: runner.os != 'Linux'
        shell: pwsh
        run: |
          ./scripts/publish-desktop.ps1 -RuntimeIdentifier '${{ matrix.rid }}'

      - name: Publish Linux client
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dotnet publish UserIdentityDesktop.csproj -c Release -r '${{ matrix.rid }}' --self-contained true -o 'artifacts/${{ matrix.rid }}'

      - name: Verify Linux ABI baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 scripts/check-linux-abi.py --source 'artifacts/${{ matrix.rid }}'

      - name: Verify packaged FFmpeg
        shell: bash
        env:
          PACKAGE_RID: ${{ matrix.rid }}
        run: |
          python -c "import os,subprocess; from pathlib import Path; rid=os.environ['PACKAGE_RID']; binary=Path('artifacts')/rid/'media'/('ffmpeg.exe' if rid.startswith('win-') else 'ffmpeg'); subprocess.run([str(binary),'-version'],check=True)"

      - name: Verify Windows and macOS packaged startup
        if: runner.os != 'Linux'
        shell: pwsh
        env:
          PACKAGE_RID: ${{ matrix.rid }}
        run: |
          $root = Join-Path $PWD "artifacts/$env:PACKAGE_RID"

          $binary = if ($IsWindows) {
            Join-Path $root 'Fire User Connect.exe'
          } else {
            Join-Path $root 'Fire User Connect.app/Contents/MacOS/Fire User Connect'
          }

          if (-not (Test-Path $binary)) {
            throw "Application executable missing: $binary"
          }

          $process = Start-Process -FilePath $binary -ArgumentList '--startup-smoke-test' -PassThru

          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Startup timed out'
          }

          if ($process.ExitCode -ne 0) {
            throw 'Application startup failed'
          }

      # ==================================================
      # INSTALLER GENERATION
      # ==================================================

      - name: Create native OS installers
        shell: bash
        run: |
          python scripts/build-installers.py --rid '${{ matrix.rid }}' --source 'artifacts/${{ matrix.rid }}' --output installers

      # ==================================================
      # UNIVERSAL LINUX INSTALLER
      # Produces .run without modifying build-installers.py
      # ==================================================

      - name: Create universal Linux RUN installer
        if: runner.os == 'Linux'
        shell: bash
        env:
          PACKAGE_RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail

          RID="$PACKAGE_RID"

          if [[ "$RID" == "linux-x64" ]]; then
            ARCH="x86_64"
          else
            ARCH="aarch64"
          fi

          VERSION=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("UserIdentityDesktop.csproj").getroot()
          version = root.findtext("PropertyGroup/Version", "1.0.0")
          print(version)
          PY
          )

          OUTPUT="installers/FireUserConnect-${VERSION}-${ARCH}.run"

          mkdir -p installers

          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT

          mkdir -p "$WORK/payload/app"
          cp -a "artifacts/$RID/." "$WORK/payload/app/"

          cp Assets/Icons/fire-user-connect-256.png \
            "$WORK/payload/icon.png"

          cat > "$WORK/launcher" <<'INSTALLER'
          #!/usr/bin/env bash
          set -euo pipefail

          SELF="$(readlink -f "$0")"
          PREFIX="${HOME}/.local/opt/fire-user-connect"
          DESKTOP=1
          MODE="user"

          usage() {
            cat <<EOF
          Fire User Connect Universal Linux Installer

          Options:
            --user          Install for current user
            --system        Install to /opt/fire-user-connect
            --prefix PATH   Custom installation directory
            --no-desktop    Skip desktop integration
            --help          Display this help

          Supported architectures: x86_64 and aarch64.
          A compatible glibc and required host libraries are necessary.
          EOF
          }

          while (($#)); do
            case "$1" in
              --user)
                PREFIX="${HOME}/.local/opt/fire-user-connect"
                MODE="user"
                shift ;;
              --system)
                PREFIX="/opt/fire-user-connect"
                MODE="system"
                shift ;;
              --prefix)
                (($# >= 2)) || {
                  echo "Missing prefix path" >&2
                  exit 1
                }
                PREFIX="$2"
                shift 2 ;;
              --no-desktop)
                DESKTOP=0
                shift ;;
              --help)
                usage
                exit 0 ;;
              *)
                echo "Unknown option: $1" >&2
                exit 1 ;;
            esac
          done

          case "$PREFIX" in
            /*) ;;
            *)
              echo "Installation path must be absolute" >&2
              exit 1 ;;
          esac

          PREFIX="${PREFIX%/}"

          if [[ -z "$PREFIX" || "$PREFIX" == "/" ]]; then
            echo "Unsafe installation directory" >&2
            exit 1
          fi

          if [[ "$MODE" == "system" ]]; then
            if (( EUID != 0 )); then
              echo "System installation requires root privileges" >&2
              exit 1
            fi
            SHARE="/usr/local/share"
          else
            SHARE="${XDG_DATA_HOME:-$HOME/.local/share}"
          fi

          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          LINE=$(awk '/^__FIREUSER_PAYLOAD__$/ {
            print NR + 1
            exit
          }' "$SELF")

          if [[ -z "$LINE" ]]; then
            echo "Installer payload missing" >&2
            exit 1
          fi

          tail -n +"$LINE" "$SELF" | tar -xz -C "$TMP"

          if [[ ! -x "$TMP/app/Fire User Connect" ]]; then
            echo "Application executable missing" >&2
            exit 1
          fi

          mkdir -p "$PREFIX"
          cp -a "$TMP/app/." "$PREFIX/"

          chmod +x "$PREFIX/Fire User Connect"

          if [[ -f "$PREFIX/media/ffmpeg" ]]; then
            chmod +x "$PREFIX/media/ffmpeg"
          fi

          if (( DESKTOP )); then
            APPDIR="$SHARE/applications"
            ICONDIR="$SHARE/icons/hicolor/256x256/apps"

            mkdir -p "$APPDIR" "$ICONDIR"

            cp "$TMP/icon.png" \
              "$ICONDIR/fire-user-connect.png"

            cat > "$APPDIR/fire-user-connect.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Fire User Connect
          Comment=Fire User native collaboration client
          Exec="$PREFIX/Fire User Connect" --open-chat %u
          TryExec=$PREFIX/Fire User Connect
          Icon=fire-user-connect
          Terminal=false
          Categories=Network;Chat;
          MimeType=x-scheme-handler/fireuserconnect;
          EOF

            if command -v update-desktop-database >/dev/null 2>&1; then
              update-desktop-database "$APPDIR" || true
            fi
          fi

          echo "Fire User Connect installed to: $PREFIX"
          exit 0
          __FIREUSER_PAYLOAD__
          INSTALLER

          tar -czf "$WORK/payload.tar.gz" -C "$WORK/payload" .

          cat "$WORK/launcher" "$WORK/payload.tar.gz" > "$OUTPUT"

          chmod +x "$OUTPUT"

          test -s "$OUTPUT"

          echo "Generated universal installer: $OUTPUT"

      # ==================================================
      # INSTALLER VERIFICATION
      # ==================================================

      - name: Verify installer output
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d installers ]; then
            echo "::error::Installer directory missing"
            exit 1
          fi

          if [ -z "$(find installers -type f -print -quit)" ]; then
            echo "::error::No installer files generated"
            exit 1
          fi

          find installers -type f -print

      - name: Verify all Linux installer formats
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          RID="${{ matrix.rid }}"

          if [[ "$RID" == "linux-x64" ]]; then
            ARCH="x86_64"
            DEB_ARCH="amd64"
          else
            ARCH="aarch64"
            DEB_ARCH="arm64"
          fi

          for extension in deb rpm pkg.tar.zst AppImage run; do
            files=(installers/*."$extension")

            if (( ${#files[@]} == 0 )); then
              echo "::error::Missing $extension installer for $RID"
              exit 1
            fi

            for installer in "${files[@]}"; do
              test -s "$installer"
              echo "Verified: $installer"
            done
          done

          for installer in installers/*.deb; do
            test "$(dpkg-deb -f "$installer" Architecture)" = "$DEB_ARCH"
          done

          for installer in installers/*.rpm; do
            test "$(rpm -qp --qf '%{ARCH}' "$installer")" = "$ARCH"
          done

          for installer in installers/*.pkg.tar.zst; do
            tar --zstd -tf "$installer" | grep -Ex '(\./)?\.PKGINFO' > /dev/null
          done

          for installer in installers/*.AppImage; do
            file "$installer" | grep -q ELF
          done

          for installer in installers/*.run; do
            bash "$installer" --help

            TEST_ROOT=$(mktemp -d)
            trap 'rm -rf "$TEST_ROOT"' EXIT

            bash "$installer" \
              --prefix "$TEST_ROOT/fire-user" \
              --no-desktop

            test -x "$TEST_ROOT/fire-user/Fire User Connect"

            rm -rf "$TEST_ROOT"
            trap - EXIT
          done

          echo "All five installer formats verified for $RID"

      # ==================================================
      # UPLOAD INSTALLER ARTIFACTS
      # ==================================================

      - name: Upload OS installers
        uses: actions/upload-artifact@v4
        with:
          name: fire-user-installers-${{ matrix.rid }}
          path: installers/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # ==================================================
      # PORTABLE APPLICATION ARCHIVES
      # ==================================================

      - name: Archive Unix portable application
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p packages
          tar -czf 'packages/fire-user-${{ matrix.rid }}.tar.gz' -C 'artifacts/${{ matrix.rid }}' .

      - name: Archive Windows portable application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path packages -Force | Out-Null

          tar -czf 'packages/fire-user-${{ matrix.rid }}.tar.gz' -C 'artifacts/${{ matrix.rid }}' .

          if ($LASTEXITCODE -ne 0) {
            throw 'Package archive failed'
          }

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: fire-user-${{ matrix.rid }}
          path: packages/fire-user-${{ matrix.rid }}.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # ==================================================
      # WINDOWS ARM COMPATIBILITY PREPARATION
      # ==================================================

      - name: Upload Windows native validation executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: native-validation-win-x64
          path: Native/build/win-x64/Release/bridge_smoke.exe
          if-no-files-found: error
          retention-days: 30

      - name: Compile Windows ARM compatibility installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python scripts/build-installers.py --rid win-arm64-emulated --source artifacts/win-x64 --output arm-installers

      - name: Stage Windows ARM installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-validation-win-arm64
          path: arm-installers/*
          if-no-files-found: error
          retention-days: 30

      # ==================================================
      # MACOS CACHE
      # ==================================================

      - name: Save verified macOS media runtime
        if: >-
          always() &&
          runner.os == 'macOS' &&
          steps.mac-media.outcome == 'success' &&
          steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Native/media/${{ matrix.rid }}
          key: source-media-${{ matrix.rid }}-${{ hashFiles('scripts/media-runtimes.json', 'scripts/build-native.py') }}

  # ==================================================
  # WINDOWS ARM64 VERIFICATION
  # ==================================================

  windows-arm:
    name: Windows 11 ARM64 compatibility
    needs: desktop

    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.target == 'all' ||
      inputs.target == 'win-arm64'

    runs-on: windows-11-arm

    steps:
      - name: Download Windows x64 package
        uses: actions/download-artifact@v4
        with:
          name: fire-user-win-x64
          path: incoming

      - name: Download Windows validation executable
        uses: actions/download-artifact@v4
        with:
          name: native-validation-win-x64
          path: validation

      - name: Download ARM installer
        uses: actions/download-artifact@v4
        with:
          name: installer-validation-win-arm64
          path: installers

      - name: Verify Windows ARM64 compatibility
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') {
            throw 'Expected ARM64 host'
          }

          New-Item -ItemType Directory -Path artifacts/win-arm64-emulated,packages -Force | Out-Null

          tar -xzf incoming/fire-user-win-x64.tar.gz -C artifacts/win-arm64-emulated

          if ($LASTEXITCODE -ne 0) {
            throw 'Package extraction failed'
          }

          Copy-Item validation/bridge_smoke.exe artifacts/win-arm64-emulated/

          Push-Location artifacts/win-arm64-emulated

          try {
            & ./bridge_smoke.exe

            if ($LASTEXITCODE -ne 0) {
              throw 'Native runtime failed'
            }

            & ./media/ffmpeg.exe -version

            if ($LASTEXITCODE -ne 0) {
              throw 'FFmpeg failed'
            }

            $process = Start-Process -FilePath "$PWD/Fire User Connect.exe" -ArgumentList '--startup-smoke-test' -PassThru

            if (-not $process.WaitForExit(30000)) {
              $process.Kill()
              throw 'ARM startup timed out'
            }

            if ($process.ExitCode -ne 0) {
              throw 'ARM startup failed'
            }

            Remove-Item bridge_smoke.exe

            'Requires Windows 11 ARM64; runs x64 binaries through emulation.' |
              Set-Content COMPATIBILITY.txt

          } finally {
            Pop-Location
          }

          tar -czf packages/fire-user-win-arm64-emulated.tar.gz -C artifacts/win-arm64-emulated .

          if ($LASTEXITCODE -ne 0) {
            throw 'ARM archive failed'
          }

      - name: Upload verified ARM installers
        uses: actions/upload-artifact@v4
        with:
          name: fire-user-installers-win-arm64-emulated
          path: installers/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload ARM portable package
        uses: actions/upload-artifact@v4
        with:
          name: fire-user-win-arm64-emulated
          path: packages/fire-user-win-arm64-emulated.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # ==================================================
  # AUTOMATIC GITHUB RELEASE
  # ==================================================

  publish-test-installers:
    name: Publish verified installers

    needs:
      - desktop
      - windows-arm

    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.target == 'all') &&
      needs.desktop.result == 'success' &&
      needs.windows-arm.result == 'success'

    runs-on: ubuntu-22.04

    permissions:
      actions: read
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: desktop-test-${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fire-user-installers-*
          path: installers
          merge-multiple: false

      # ----------------------------------------------
      # Validate required platforms
      # ----------------------------------------------

      - name: Verify all platform installer groups
        shell: bash
        run: |
          set -euo pipefail

          required=(
            win-x64
            win-arm64-emulated
            linux-x64
            linux-arm64
            osx-x64
            osx-arm64
          )

          for rid in "${required[@]}"; do
            directory="installers/fire-user-installers-$rid"

            if [ ! -d "$directory" ]; then
              echo "::error::Missing platform: $rid"
              exit 1
            fi

            if [ -z "$(find "$directory" -type f -print -quit)" ]; then
              echo "::error::No installers found for $rid"
              exit 1
            fi

            echo "Verified: $rid"
          done

      # ----------------------------------------------
      # Prepare release assets
      # ----------------------------------------------

      - name: Prepare installers and SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          python3 - <<'PY'
          import hashlib
          import pathlib
          import shutil

          source = pathlib.Path("installers")
          output = pathlib.Path("release-assets")

          files = sorted(
              item for item in source.rglob("*")
              if item.is_file()
          )

          if not files:
              raise SystemExit("No installers found")

          for item in files:
              destination = output / item.name

              if destination.exists():
                  raise SystemExit(
                      f"Duplicate installer filename: {item.name}"
                  )

              shutil.copy2(item, destination)

          manifest = output / "SHA256SUMS.txt"

          with manifest.open("w", encoding="utf-8") as stream:
              for item in sorted(output.iterdir()):
                  if item == manifest or not item.is_file():
                      continue

                  digest = hashlib.sha256()

                  with item.open("rb") as content:
                      for block in iter(
                          lambda: content.read(1024 * 1024),
                          b""
                      ):
                          digest.update(block)

                  stream.write(
                      f"{digest.hexdigest()}  {item.name}\n"
                  )

          for item in sorted(output.iterdir()):
              print(item.name, item.stat().st_size, "bytes")
          PY

      # ----------------------------------------------
      # Create draft release
      # ----------------------------------------------

      - name: Create draft GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "Fire User Desktop - $RELEASE_TAG" \
            --notes "Automated Fire User Desktop test build.

          Commit: $RELEASE_COMMIT
          Workflow: $GITHUB_RUN_ID
          Attempt: $GITHUB_RUN_ATTEMPT

          Supported packages:

          Windows:
          - Windows x64
          - Windows 11 ARM64 via x64 emulation

          macOS:
          - Intel x64
          - Apple Silicon ARM64

          Linux x64 and ARM64:
          - Debian .deb
          - RPM .rpm
          - Arch .pkg.tar.zst
          - Portable .AppImage
          - Universal .run installer

          SHA256SUMS.txt contains installer checksums.

          Test build. Installers may be unsigned or unnotarized." \
            --draft \
            --prerelease

      # ----------------------------------------------
      # Upload every installer
      # ----------------------------------------------

      - name: Upload installers to GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "$RELEASE_TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY"

      # ----------------------------------------------
      # Verify release assets
      # ----------------------------------------------

      - name: Verify release uploads
        shell: bash
        run: |
          set -euo pipefail

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' \
            > published-assets.txt

          while IFS= read -r filename; do
            if ! grep -Fxq "$filename" published-assets.txt; then
              echo "::error::Missing release asset: $filename"
              exit 1
            fi
          done < <(
            find release-assets \
              -maxdepth 1 \
              -type f \
              -printf '%f\n'
          )

          echo "All release assets verified"

      # ----------------------------------------------
      # Publish prerelease
      # ----------------------------------------------

      - name: Publish verified prerelease
        shell: bash
        run: |
          set -euo pipefail

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease

      # ----------------------------------------------
      # Show download link
      # ----------------------------------------------

      - name: Display release download location
        shell: bash
        run: |
          set -euo pipefail

          URL=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json url \
            --jq '.url')

          echo "Published release: $URL"

          {
            echo "## Fire User Desktop installers"
            echo ""
            echo "All platform installer groups were verified."
            echo ""
            echo "**Download release:** $URL"
            echo ""
            echo "**Commit:** \`$RELEASE_COMMIT\`"
            echo ""
            echo "**Tag:** \`$RELEASE_TAG\`"
            echo ""
            echo "Installers and portable archives are also available under this workflow run's Artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
